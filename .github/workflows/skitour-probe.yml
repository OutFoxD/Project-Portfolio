name: skitour probe (temporary)
on:
  push:
    branches: ["skitour-probe"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests numpy xarray netCDF4 pyproj pillow scipy
      - name: Probe
        run: python probe/probe.py "$RUNNER_TEMP/out" || true
      - name: Publish probe output
        run: |
          cd "$RUNNER_TEMP/out" && git init -q -b skitour-probe-out && git config user.name probe && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "probe output" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" skitour-probe-out
