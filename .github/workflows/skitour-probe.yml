name: skitour probe (temporary)
on:
  push:
    branches: ["skitour-probe"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests numpy scipy xarray netCDF4 pyproj pillow playwright
      - name: Live site screenshots
        run: |
          python -m playwright install --with-deps chromium > /dev/null 2>&1
          mkdir -p "$RUNNER_TEMP/out" site
          python probe/shots.py site "$RUNNER_TEMP/out/live" "https://protofox.at/skitour/" > "$RUNNER_TEMP/out/live_log.txt" 2>&1 || true
      - name: Publish probe output
        run: |
          cd "$RUNNER_TEMP/out" && git init -q -b skitour-probe-out && git config user.name probe && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "probe output" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" skitour-probe-out
