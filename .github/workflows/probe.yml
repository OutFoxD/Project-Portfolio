name: shroomzn probe (temporary)
on:
  push:
    branches: ["shroomzn-probe"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests numpy xarray netCDF4 pyproj pillow matplotlib
      - name: Previous dry-run output
        run: git clone --depth 1 --branch shroomzn-probe-out "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$RUNNER_TEMP/data"
      - name: Verify only (+ regions.json via the alignment step)
        run: |
          python -c "import sys; sys.path.insert(0,'shroomzn'); import precompute as p; print(p.align_station_files('$RUNNER_TEMP/data', None))"
          mkdir -p "$RUNNER_TEMP/cache" && curl -sS -o "$RUNNER_TEMP/cache/pr_hyras_1_2026_v6-1_de.nc" https://opendata.dwd.de/climate_environment/CDC/grids_germany/daily/hyras_de/precipitation/pr_hyras_1_2026_v6-1_de.nc
          python shroomzn/verify.py "$RUNNER_TEMP/data" "$RUNNER_TEMP/cache" > "$RUNNER_TEMP/data/verify_log.txt" 2>&1 || true
      - name: Publish probe output
        run: |
          cd "$RUNNER_TEMP/data" && rm -rf .git && git init -q -b shroomzn-probe-out && git config user.name probe && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "probe output" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shroomzn-probe-out
